name: Bouffalo Lab
description: >-
  Bouffalo Lab (博流智能) is a fabless chip design company founded in 2016 and headquartered
  in Nanjing, China, focused on ultra-low-power AIoT (AI + IoT) and edge-computing system
  chips. Its product line centers on RISC-V based microcontrollers with integrated wireless
  connectivity — the BL602/BL604 (Wi-Fi 2.4G + BLE 5.0), BL702/BL704/BL706 (Zigbee 3.0 +
  BLE 5.0), BL606P (quad-mode dual-core Wi-Fi/BT/BLE/Zigbee), and the BL616/BL618 and BL808
  families — combining wireless radios, audio/video processing, and on-device AI algorithms.
  The company ships the open-source BouffaloSDK (a merge of bl_mcu_sdk and bl_iot_sdk) under
  Apache 2.0 through its public GitHub organization, along with hardware abstraction drivers,
  Matter/Thread support, and NuttX RTOS ports. Bouffalo Lab is a hardware/firmware provider
  rather than a web-API provider; it exposes no public HTTP/REST developer API, so the
  enrichment pipeline captures its developer surface (GitHub SDK org) and domain security
  posture. It is a portfolio company of Qiming Venture Partners.
